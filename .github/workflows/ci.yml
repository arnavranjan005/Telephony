name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Dummy connection strings: prisma generate only reads the schema file
    # (it doesn't connect), and the Jest suite mocks Prisma/Redis/Telnyx/Google
    # everywhere, so no real Postgres or Redis service is needed to run CI.
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/telephony_ci"
      REDIS_URL: "rediss://default:password@localhost:6379"
      TELNYX_API_KEY: "ci_telnyx_api_key"
      TELNYX_CONNECTION_ID: "ci_connection_id"
      TELNYX_FROM_NUMBER: "+15550000000"
      GOOGLE_AI_API_KEY: "ci_google_ai_key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx nx run database:prisma-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telephony
          POSTGRES_PASSWORD: telephony
          POSTGRES_DB: telephony_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U telephony"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx nx run database:prisma-generate

      - name: Push schema to e2e database
        run: npm run e2e:migrate

      - name: Run e2e suite
        run: npx nx run e2e:e2e
