name: CD

# Manual-only VPS deploy. Triggered by clicking "Run workflow" in the Actions
# tab — never on push/PR (see ci.yml for that). Restricted to `main` via the
# job-level `if` below, since workflow_dispatch itself has no branch filter
# (a workflow file present on any branch can be dispatched from it).
on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Everything runs on the VPS itself against the repo checkout already
      # there (DEPLOY_PATH) — no build artifacts are produced or shipped by
      # the runner. apps/web currently runs via `next dev` under PM2 (not a
      # production build/static export), so it only needs deps reinstalled
      # and a restart, same as api/worker.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npx nx run database:prisma-generate

            npx nx run api:build
            npx nx run worker:build

            pm2 restart api
            pm2 restart worker
            pm2 restart web

      # Database schema changes (prisma db push / migrate deploy) are not
      # run here — DEPLOYMENT.md notes there's no prisma/migrations/
      # directory yet, so this stays a manual step when needed.
