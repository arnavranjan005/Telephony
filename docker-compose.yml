# Real Postgres + Redis for local e2e testing (apps/e2e). Not used by unit/
# integration tests, which mock these boundaries - this is specifically for
# exercising the real distributed-claim logic, Prisma transactions, and
# BullMQ queue round-trip against real infrastructure. Non-default ports so
# this doesn't collide with any Postgres/Redis you already have running.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telephony
      POSTGRES_PASSWORD: telephony
      POSTGRES_DB: telephony_e2e
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telephony"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data # throwaway data - no need to persist across runs

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
